name: Build & Sign Android App

on:
  push:
    paths:
      - 'VERSION.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Get Version and Git Hash
        id: vars
        run: |
          VERSION=$(cat VERSION.txt)
          GITHASH=$(git rev-parse --short HEAD)
          FULL_VERSION="${VERSION}-${GITHASH}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "githash=$GITHASH" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Update Version in package.json
        run: |
          npm version ${{ steps.vars.outputs.version }} --no-git-tag-version

      - name: Update Android VersionName and VersionCode
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ steps.vars.outputs.full_version }}\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ steps.vars.outputs.version_code }}/" android/app/build.gradle

      - name: Install dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Generate Android Assets
        run: npx @capacitor/assets generate --android --assetPath public


      - name: Build Android App (APK & AAB)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Rename files
        run: |
          mv ${{ steps.sign_app.outputs.signedReleaseFile }} lilac-echoes.apk
          mv ${{ steps.sign_aab.outputs.signedReleaseFile }} lilac-echoes.aab
          mv android/app/build/outputs/apk/debug/app-debug.apk lilac-echoes-debug.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lilac-echoes-build-artifacts
          path: |
            lilac-echoes.apk
            lilac-echoes.aab
            lilac-echoes-debug.apk

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            lilac-echoes.apk
            lilac-echoes.aab
            lilac-echoes-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
